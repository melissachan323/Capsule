<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Friends - Capsule</title>
    <script src="../js/user-cards.js" defer></script>
    <script src="../js/friend-request-card.js" defer></script>
    <script src="../js/search.js" defer></script>
    <link rel="stylesheet" href="../assets/css/design-tokens.css">
    <link rel="stylesheet" href="../assets/css/shared-components.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="screen">
        <!-- Secondary Header -->
        <header class="header-secondary hgap-4">
            <button class="icon-button">
                <img src="../Icons/Icon Name=akar-icons_chevron-left-small.svg" alt="Back">
            </button>
            <h1 class="title">Add Friends</h1>
        </header>

        <!-- Search Field -->
        <search-field value="alex"></search-field>
        <!-- Search Result Cards -->
        <div class="gap-8 mt-4">
            <!-- Card A -->
            <user-card username="@alex_haha" time="9:24 AM [+16h]" avatar="../Avatar/Photo by Happy Face Emoji.png"></user-card>           
            <!-- Card B -->
            <user-card username="@alex_nono" time="6:24 AM [+13h]" avatar="../Avatar/Photo by Jeffrey Keenan.png"></user-card>
        </div>
        <!-- Address Book Card -->
        <div class="card card-padded mt-4 flex-between">
            <div>
                <button class="icon-button">
                    <img src="../Icons/Icon Name=Contacts.svg">
                </button>
            </div>
            <div>
                <h3>Address Book</h3>
                <p class="text-caption">6 acquaintances found</p>
            </div>
            <button class="button-secondary">SYNC CONTACTS</button>
        </div>

<!-- Friend Requests Section -->
        <div class="mt-6">
           <div class="hgap-4">
                <h4>FRIEND REQUESTS</h4>
                <div class="count-badge ms-2">2</div>
            </div>

            <div class="gap-8 mt-4">
                <!-- Friend Request Card 1 -->
                <friend-request-card 
                    avatar="../Avatar/Photo by Logan Isbell.png"
                    username="@chloem" 
                    time-ago="3h ago" 
                    local-time="9:24 AM [+16h]">
                </friend-request-card>
            

                <!-- Friend Request Card 2 -->
                <friend-request-card 
                    avatar="../Avatar/Photo by Pesce Huang.png"
                    username="@joeyblues" 
                    time-ago="1d ago" 
                    local-time="8:24 AM [+15h]">
                </friend-request-card>     
            </div>
        <div>
</div>

    <!-- Bottom Navigation Bar -->
    <script>
  // Listen for navigation changes
  document.querySelector('bottom-nav').addEventListener('tab-change', (e) => {
    console.log('Navigated to:', e.detail.tab);
  });
</script>
</body>
</html>
        </div>
