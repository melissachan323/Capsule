<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera Edit - Capsule</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/design-tokens.css">
    <link rel="stylesheet" href="../assets/css/shared-components.css">
</head>
<body>
    <div class="screen">
        <!-- Empty header band -->

        <!-- Preview Card -->
        <div class="card card-bordered" style="width:100%;display: flex; flex-direction: column; position: relative; margin-top: 64px;">
            <!-- Photo --> 
                <div style="width: 100%; height: 300px">
                    <img src="../images/Camera.png" alt="Food" style="object-fit: cover; width: 100%; height: 100%;">
                </div>
        
            <!-- Button container -->
            <div class="camera-header edit">
                <!-- Top-left overlay: Retake button -->
                <button class="icon-button with-text">
                    <img src="../Icons/Icon Name=Retake.svg" alt="Retake">
                    <span class="text-button" style="color: var(--color-text-emphasis);">RETAKE</span>
                </button>
                <!-- Top-right overlay: Trash button -->
                <button class="icon-button" >
                    <img src="../Icons/Icon Name=Trash.svg" alt="Trash">
                </button>
                
            </div>
            
            <!-- Caption strip -->
            <div style="display: flex; align-items: flex-start; padding: var(--space-3) var(--space-3); gap: var(--space-2);">
                <img src="../Icons/Icon Name=Caption.svg" alt="Caption">
                <span class="text-body" style="font-size: 16px;">Dolores sunset glow 🌇</span>
            </div>
        </div>

        <!-- Primary action pinned at the bottom -->
        <button class="button-primary" id="send-capsule-btn" style="width: 350px; gap: var(--space-2); position: fixed; bottom: 24px; ">
            <img src="../Icons/Icon Name=Send.svg" alt="Send">
            <span>SEND CAPSULE</span>
        </button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
  const sendButton = document.getElementById('send-capsule-btn');

  if (sendButton) {
    sendButton.addEventListener('click', (e) => {
      e.preventDefault();
      // Navigate to your capsules page
      window.location.href = 'capsule-page.html';
    });
  }
});
    </script>

</body>
</html>
