<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera Edit - Capsule</title>
    <link rel="stylesheet" href="../assets/css/design-tokens.css">
    <link rel="stylesheet" href="../assets/css/shared-components.css">
</head>
<body>
    <div class="screen">
        <!-- Empty header band -->
        <div style="height: 48px; border-bottom: 1px solid var(--color-button-stroke);"></div>

        <!-- Preview Card -->
        <div class="card card-bordered mt-4" style="height: 300px; position: relative;">
            <!-- Photo placeholder -->
            <div style="position: absolute; top: 0; left: 0; right: 0; bottom: 50px; background-color: var(--color-bg-component);">
                <!-- In a real app, this would be the photo -->
                <div style="width: 100%; height: 100%; background-color: #666; display: flex; align-items: center; justify-content: center; color: var(--color-text-emphasis); font-size: 18px;">
                    Photo Preview
                </div>
            </div>
            <!-- Top-left overlay: Retake button -->
            <div class="mt-3 ms-3" style="position: absolute; top: 0; left: 0;">
                <button class="icon-button" style="background-color: rgba(0,0,0,0.5);">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="currentColor" d="M12 4v2l4.4 4.4a2 2 0 010 2.8l-2.82.82a4.95 4.95 0 00-1.06-1.06l.82-2.82V8l-4 4H6a2 2 0 01-2-2V6a2 2 0 012-2h8z"/></svg>
                </button>
                <span class="text-caption text-emphasis ms-2" style="font-size: 12px; text-transform: uppercase;">RETAKE</span>
            </div>
            <!-- Top-right overlay: Trash button -->
            <div class="mt-3 me-3" style="position: absolute; top: 0; right: 0;">
                <button class="icon-button" style="background-color: rgba(0,0,0,0.5);">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="currentColor" d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                </button>
            </div>
            <!-- Caption strip -->
            <div style="position: absolute; bottom: 0; left: 0; right: 0; height: 50px; background-color: rgba(0,0,0,0.7); display: flex; align-items: center; padding: 0 16px;">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="me-2" style="width: 20px; height: 20px; fill: var(--color-text-emphasis);"><path fill="currentColor" d="M14.06 9.02l1.41 1.41L12 14.83l-3.03-3.03 1.41-1.41L12 12l2.47-2.47zM20 12l-1.41-1.41L18 10.58l2.12-2.12L22 8.29l-1.41 1.41L20.59 10l1.41 1.41L22 11.59l-1.41 1.41L20.59 13l-1.41-1.41L19 11.59l1.41 1.41z"/></svg>
                <span class="text-body text-emphasis" style="font-size: 16px;">Dolores sunset glow 🌇</span>
            </div>
        </div>

        <!-- Large empty black area -->
        <div style="flex: 1; background-color: var(--color-bg);"></div>

        <!-- Primary action pinned at the bottom -->
        <button class="button-primary mt-4" style="width: 100%;">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" class="me-2" style="width: 20px; height: 20px; fill: var(--color-text-black);"><path fill="currentColor" d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            <span>SEND CAPSULE</span>
        </button>
    </div>
</body>
</html>
