<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capsule Page - Capsule</title>
    <script src="../js/bottom-nav.js" defer></script>
    <script src="../js/horizontal-carousel.js" defer></script>
    <script src="../js/reply-bar.js" defer></script>
    <script src="../js/capsule-card.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/design-tokens.css">
    <link rel="stylesheet" href="../assets/css/shared-components.css">
</head>
<body>
    <div class="screen">
        <!-- Top-level Header -->
        <header class="header-top-level">
            <div class="space"></div>
            <div class="wordmark">CAPSULE</div>
            <div class="space">
                <button class="icon-button" onclick="window.location.href='add-friends.html'">
                    <img src="../Icons/Icon Name=Add Friend.svg" alt="Add Friend">
                </button>
                <button class="icon-button ms-2">
                    <img src="../Icons/Icon Name=Settings.svg" alt="Settings" alt="Settings">
                </button>
            </div>
        </header>

        <!-- Filter Chips -->
        <div class="filter-chip-container mb-4">
            <div class="filter-chip selected">
                RECEIVED
                <div class="count-badge count-badge-light">2</div>
            </div>
            <div class="filter-chip unselected ms-2">
                SENT
                <div class="count-badge">2</div>
            </div>
        </div>

        <!-- Date and Time Block -->
        <div class="date-time-block mb-4">
            <div class="date mb-2">Thursday, May 24</div>
            <div class="time" id="current-time">09:10 PM</div>
            <div class="text-caption-2 mt-2" style="color: var(--color-text-caption)">scroll to view</div>
        </div>

        <!-- Horizontal carousel of capsules -->
         <horizontal-carousel>
           <capsule-card
             name="Elena Vance"
             avatar-src="../Avatar/Photo by Pesce Huang.png"
             photo-src="../images/Camera.png"
             timestamp="2026-05-24T18:05:00"
           ></capsule-card>
           <capsule-card
             name="Marcus Lee"
             avatar-src="../Avatar/Photo by Matas Katinas.png"
             photo-src="../images/Camera.png"
             timestamp="2026-05-24T21:10:00"
           ></capsule-card>
           <capsule-card
             name="Sofia Ruiz"
             avatar-src="../Avatar/Photo by Lina Ng.png"
             photo-src="../images/Camera.png"
             timestamp="2026-05-25T02:30:00"
           ></capsule-card>
         </horizontal-carousel>
        


        <!-- Reply Bar -->
        <reply-bar></reply-bar>

        
    <!-- Bottom Navigation Bar -->
    <bottom-nav active-tab="capsules"></bottom-nav>

       
<script type="module">
      import '../js/horizontal-carousel.js';
      import '../js/capsule-card.js';
      document.addEventListener('DOMContentLoaded', () => {
        const timeEl = document.getElementById('current-time');
        const dateEl = document.querySelector('.date');
        function formatTime(iso) {
          const d = new Date(iso);
          return d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
        }
        function formatDate(iso) {
          const d = new Date(iso);
          return d.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        }
        document.addEventListener('capsule-changed', e => {
          const { timestamp } = e.detail;
          if (!timestamp) return;
          timeEl.textContent = formatTime(timestamp);
          dateEl.textContent = formatDate(timestamp);
        });
      });
    </script>
</body>
</html>
