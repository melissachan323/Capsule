<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera - Capsule</title>
    <link rel="stylesheet" href="../assets/css/design-tokens.css">
    <link rel="stylesheet" href="../assets/css/shared-components.css">
    <style>
        .viewfinder {
            position: relative;
            width: 100%;
            height: 100vh;
            background-color: #000;
            overflow: hidden;
        }
        .viewfinder img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(255,255,255,0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.1) 1px, transparent 1px);
            background-size: 33.33% 33.33%;
            pointer-events: none;
        }
        .reticle {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 56px;
            height: 56px;
            margin: -28px 0 0 -28px;
            border: 1px solid var(--color-text-emphasis);
            border-radius: 50%;
        }
        .reticle::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 6px;
            height: 6px;
            margin: -3px 0 0 -3px;
            background-color: var(--color-text-emphasis);
            border-radius: 50%;
        }
        .button-icon {
            position: absolute;
            top: 20px;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: rgba(0,0,0,0.5);
            border: 1px solid var(--color-button-stroke);
            border-radius: 50%;
        }
        .button-icon svg {
            width: 20px;
            height: 20px;
            fill: var(--color-text-emphasis);
        }
        .bottom-deck {
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
        }
        .mode-switcher {
            position: relative;
            width: 146px;
            height: 33px;
            background-color: rgba(0,0,0,0.5);
            border-radius: 20px;
            display: flex;
        }
        .mode-switcher .segment {
            flex: 1;
            text-align: center;
            line-height: 33px;
            color: var(--color-text-inactive);
            font: var(--text-button);
            text-transform: uppercase;
        }
        .mode-switcher .segment.active {
            background-color: var(--color-text-emphasis);
            color: var(--color-text-black);
            border-radius: 20px;
        }
        .thumbnail {
            position: absolute;
            left: 20px;
            bottom: 20px;
            width: 48px;
            height: 48px;
            border: 1px solid var(--color-text-emphasis);
            border-radius: 50%;
            overflow: hidden;
        }
        .thumbnail img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .shutter {
            position: absolute;
            left: 50%;
            bottom: 20px;
            width: 80px;
            height: 80px;
            margin-left: -40px;
        }
        .shutter .ring {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 1px solid var(--color-text-emphasis);
            border-radius: 50%;
        }
        .shutter .disc {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 66px;
            height: 66px;
            margin-top: -33px;
            margin-left: -33px;
            background-color: var(--color-text-emphasis);
            border-radius: 50%;
        }
    </style>
</head>
<body>
    <div class="screen">
        <div class="viewfinder">
            <!-- Viewfinder image placeholder -->
            <div style="width: 100%; height: 100%; background-color: #000; display: flex; align-items: center; justify-content: center; color: var(--color-text-inactive); font-size: 16px;">
                Viewfinder Feed
<!-- Rule-of-thirds grid -->
            <div class="grid"></div>
            <!-- Center focus reticle -->
            <div class="reticle"></div>
<!-- Top-left: Close button -->
            <div class="button-icon" style="left: 20px;">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="currentColor" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41z"/></svg>
            </div>
            <!-- Top-right: Camera flip button -->
            <div class="button-icon" style="right: 20px;">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="currentColor" d="M10.01 14H15v2h2v-2h3.5l-3.5-3.97 3.5-3.97H18.5v2h-3.5l-2.99 3.23-2.99-3.23H13.5v2zm5.99-7l-3.5 3.97-3.5-3.97H14V4h-2v3h-3.5l3.5 3.97 3.5-3.97H20v3z"/></svg>
            </div>
<!-- Bottom control deck -->
            <div class="bottom-deck">
                <!-- Mode switcher -->
                <div class="mode-switcher">
                    <div class="segment active">PHOTO</div>
                    <div class="segment">VIDEO</div>
                </div>
                <!-- Last-captured thumbnail -->
                <div class="thumbnail">
                    <img src="#" alt="Last captured">
                </div>
                <!-- Shutter button -->
                <div class="shutter">
                    <div class="ring"></div>
                    <div class="disc"></div>
                </div>
                <!-- Right side empty -->
                <div style="width: 48px;"></div>
            </div>
        </div>
    </div>
</body>
</html>
