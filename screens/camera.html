<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera - Capsule</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/design-tokens.css">
    <link rel="stylesheet" href="../assets/css/shared-components.css">
    <link rel="stylesheet" href="../assets/css/camera.css">
  
</head>
<body>
    <div class="screen">

        <div class="viewfinder">
            <header class="camera-header">
                <!-- Top-left: Close button -->
                <button class="icon-button">
                    <img src="../Icons/Icon Name=Cross.svg" alt="Back">
                </button>

                <!-- Top-right: Camera flip button -->
                <button class="icon-button">
                    <img src="../Icons/Icon Name=Camera Flip.svg" alt="Back">
                </button>
            </header>
            <img src="../Images/Camera.png">
        
<!-- Bottom control deck -->
            <div class="bottom-deck">
  <!-- Top Level: Mode Switcher -->
  <div class="mode-switcher-container">
    <div class="mode-switcher">
      <div class="segment active">PHOTO</div>
      <div class="segment">VIDEO</div>
    </div>
  </div>

  <!-- Bottom Level: Controls Row -->
  <div class="controls-row">

    <div class="thumbnail">
      <img src="../images/nature.png" alt="Last captured">
    </div>

    <!-- Center: Shutter Button -->
    <button class="shutter" aria-label="Take Photo">
      <div class="ring"></div>
      <div class="disc"></div>
    </button>

    <!-- Right: Spacer to maintain center alignment -->
    <div class="spacer"></div>
  </div>
</div>
        </div>
    </div>
</body>
</html>
            </div>
