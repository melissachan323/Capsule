<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Page - Capsule</title>
    <script src="../js/bottom-nav.js" defer></script>
    <script src="../js/chat-card.js" defer></script>
    <link rel="stylesheet" href="../assets/css/design-tokens.css">
    <link rel="stylesheet" href="../assets/css/shared-components.css">
    <script src="../js/search.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="screen">
        <!-- Top-level Header -->
        <header class="header-top-level">
            <div class="space"></div>
            <div class="wordmark">CAPSULE</div>
            <div class="space">
                <button class="icon-button">
                    <img src="../Icons/Icon Name=Add Friend.svg" alt="Add Friend">
                </button>
                <button class="icon-button ms-2">
                    <img src="../Icons/Icon Name=Settings.svg" alt="Settings" alt="Settings">
                </button>
            </div>
        </header>

        <!-- Search Field -->
        <search-field> </search-field>

<!-- Conversation Cards -->
        <div class="mt-4">
            <div style="display:flex; flex-direction: column; gap: var(--space-2);">
                <chat-card
                title="Across the Pond"
                time="42 min ago"
                members="Liam, Maya"
                message="Liam: Sunset over Thames is unreal tonight..."
                avatars="../Avatar/Photo by Happy Face Emoji.png, ../Avatar/Photo by Jeffrey Keenan.png, ../Avatar/Photo by Logan Isbell.png">
                </chat-card>

                <chat-card
                title="Across the Pond"
                time="42 min ago"
                members="Liam, Maya"
                message="Liam: Sunset over Thames is unreal tonight..."
                unread-count="2"
                avatars="../Avatar/Photo by Happy Face Emoji.png, ../Avatar/Photo by Jeffrey Keenan.png, ../Avatar/Photo by Logan Isbell.png">
                </chat-card>

                <chat-card
                title="Elena"
                time="42 min ago"
                members="7:24 AM [+16h]"
                message="Morning coffee in Shibuya!!"
                avatar="../Avatar/Photo by Happy Face Emoji.png"
                status-icon="🌙">
                </chat-card>

                <chat-card
                title="Elena"
                time="42 min ago"
                members="7:24 AM [+16h]"
                message="Morning coffee in Shibuya!!"
                avatar="../Avatar/Photo by Happy Face Emoji.png"
                unread-count="2"
                status-icon="🌙">
                </chat-card>  
            </div>
                           

        </div>
            

    <bottom-nav active-tab="chats"></bottom-nav>

<script>
  // Listen for navigation changes
  document.querySelector('bottom-nav').addEventListener('tab-change', (e) => {
    console.log('Navigated to:', e.detail.tab);
  });
</script>

</body>
</html>
        </div>
