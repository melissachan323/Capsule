<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - Capsule</title>
    <link rel="stylesheet" href="../assets/css/design-tokens.css">
    <link rel="stylesheet" href="../assets/css/shared-components.css">
    <style>
        .reply-bar {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 390px;
        }
    </style>
</head>
<body>
    <div class="screen">
        <!-- Secondary Header -->
        <header class="header-secondary mb-4">
            <button class="back-button icon-button">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="currentColor" d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
            </button>
            <div class="avatar avatar-lg">
                <div class="avatar-placeholder"></div>
            </div>
            <h1 class="title">Elena Vance</h1>
            <div class="ms-auto">
                <div style="background-color: var(--color-bg-component); border: 1px solid var(--color-button-stroke); border-radius: 50%; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;">
                    <div style="width: 12px; height: 12px; background-color: var(--color-text-emphasis); border-radius: 50%;"></div>
                </div>
                <span class="text-caption text-emphasis ms-2" style="font-size: 14px;">7:24 AM [+16h]</span>
            </div>
        </header>

        <!-- Date Chip -->
        <div class="flex-center mb-4">
            <div style="background-color: var(--color-bg-component); border: 1px solid var(--color-button-stroke); border-radius: 20px; padding: 4px 12px;">
                <span class="text-caption">Today</span>
            </div>
<!-- Message 1: Received -->
        <div class="mb-4">
            <div class="flex-between">
                <div class="flex-1" style="max-width: 75%;">
                    <div class="card card-bordered" style="overflow: hidden; display: flex; flex-direction: column;">
                        <!-- Photo placeholder -->
                        <div style="flex: 1; background-color: var(--color-bg-component); display: flex; align-items: center; justify-content: center; color: var(--color-text-emphasis); font-size: 18px;">
                            Message Photo
                        </div>
                        <!-- Caption strip -->
                        <div style="background-color: var(--color-bg-component); padding: 8px 12px;">
                            <p class="text-body text-emphasis" style="font-size: 15px; margin: 0;">Rain cleared up finally</p>
                        </div>
                    </div>
                </div>
                <div>
                    <p class="text-caption mt-2">Sent 4:20 PM</p>
                </div>
            </div>
        </div>

        <!-- Message 2: Sent text reply with quoted reply -->
        <div class="mb-4">
            <div class="flex-between">
                <div>
                    <p class="text-caption mt-2">Sent 9:00 AM</p>
                </div>
                <div class="flex-1" style="max-width: 75%; text-align: right;">
                    <div style="display: inline-block; max-width: 100%;">
                        <!-- Quoted reply block -->
                        <div style="background-color: var(--color-bg-component); border-radius: 28px; padding: 12px; margin-bottom: 8px; display: flex; flex-direction: column;">
                            <div style="display: flex; align-items: start; margin-bottom: 8px;">
                                <div style="width: 4px; height: 40px; background-color: var(--color-text-emphasis); border-radius: 2px; margin-right: 8px;"></div>
                                <div class="avatar avatar-lg" style="flex-shrink: 0;">
                                    <div class="avatar-placeholder"></div>
                                </div>
                                <div>
                                    <p class="text-caption-2 text-inactive" style="margin: 0; font-size: 10px; text-transform: uppercase;">ELENA'S MOMENT</p>
                                    <p class="text-body text-emphasis" style="margin: 4px 0 0 0; font-size: 14px;">Rain cleared up finally</p>
                                </div>
                            </div>
                            <!-- Message text -->
                            <p class="text-body text-emphasis" style="font-size: 20px; line-height: 1.4; margin: 0;">Looks so peaceful! Grab coffee for me ☕</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Message 3: Sent photo -->
        <div class="mb-4">
            <div class="flex-between">
                <div>
                    <p class="text-caption mt-2">Sent 4:20 PM</p>
                </div>
                <div class="flex-1" style="max-width: 75%; text-align: right;">
                    <div class="card card-bordered" style="overflow: hidden; display: flex; flex-direction: column;">
                        <!-- Photo placeholder -->
                        <div style="flex: 1; background-color: var(--color-bg-component); display: flex; align-items: center; justify-content: center; color: var(--color-text-emphasis); font-size: 18px;">
                            Message Photo
                        </div>
                        <!-- Caption strip -->
                        <div style="background-color: var(--color-bg-component); padding: 8px 12px;">
                            <p class="text-body text-emphasis" style="font-size: 15px; margin: 0;">Here's my weather today!</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
<!-- Reply Bar (floating at bottom) -->
        <div class="reply-bar">
            <button class="icon-button">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="currentColor" d="M12 4v2l4.4 4.4a2 2 0 010 2.8l-2.82.82a4.95 4.95 0 00-1.06-1.06l.82-2.82V8l-4 4H6a2 2 0 01-2-2V6a2 2 0 012-2h8z"/></svg>
            </button>
            <button class="icon-button ms-2">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="currentColor" d="M12 14l1.41-1.41L16 11.59l1.41 1.41L18 13l-2.12 2.12L16 15.41l-1.41 1.41L12 13.41l-1.41-1.41L8 11.59l1.41-1.41L10 10l1.41 1.41L12 11.59z"/></svg>
            </button>
            <span class="placeholder flex-1 ms-2 me-2">Reply to Elena…</span>
            <button class="send-button icon-button">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="currentColor" d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            </button>
        </div>
    </div>
</body>
</html>
        </div>
